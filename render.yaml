services:
  - type: web
    name: sih-206-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        value: 0f62d848616b64ca89624e004c7266f6f152f2940eaa280842fddc6b8220c221
      - key: CORS_ORIGIN
        value: https://sih-206.vercel.app
      - key: PORT
        value: 10000
