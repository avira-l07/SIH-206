services:
  - type: web
    name: sih-206-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # NOTE ON DATABASE PERSISTENCE:
    # SQLite requires a persistent disk volume on Render (supported on Starter/Standard tiers).
    # Mounting the database to /var/data ensures shelters, alerts, SOS requests, and users
    # persist across manual restarts, redeployments, and container restarts.
    #
    # Initialize durable storage with reviewed migrations before startup.
    # Never seed/reset real data on service restart; see docs/deployment_guide.md.
    disk:
      name: sih-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://sih-206.vercel.app
      - key: PORT
        value: 10000
